services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keryvio
      POSTGRES_USER: keryvio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keryvio-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keryvio -d keryvio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
